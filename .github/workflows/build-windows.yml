name: Windows portable package (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DFSI_BUILD_APP=ON -DFSI_BUILD_TESTS=ON
          -DFLUENT_QT_BUILD_GALLERY=OFF -DFLUENT_QT_BUILD_EXAMPLES=OFF
          -DFLUENT_QT_BUILD_TESTS=OFF -DFLUENT_QT_INSTALL=OFF
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
      - name: Smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          & .\build\Release\fluent-system-info.exe --smoke
          if ($LASTEXITCODE -ne 0) { throw 'GUI smoke test failed' }
      - name: Package with Qt runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist/FluentSystemInfo | Out-Null
          Copy-Item build/Release/fluent-system-info.exe dist/FluentSystemInfo/
          & windeployqt --release --compiler-runtime --no-translations --dir dist/FluentSystemInfo dist/FluentSystemInfo/fluent-system-info.exe
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed' }
          if (-not (Test-Path dist/FluentSystemInfo/platforms/qwindows.dll)) { throw 'Qt platform plugin missing' }
          Compress-Archive -Path dist/FluentSystemInfo -DestinationPath dist/FluentSystemInfo-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: FluentSystemInfo-Windows-x64
          path: dist/FluentSystemInfo-Windows-x64.zip
          if-no-files-found: error
