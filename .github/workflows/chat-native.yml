name: Native FluentChat Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/fluent-chat/**'
      - 'CMakeLists.txt'
      - '.github/workflows/chat-native.yml'
  push:
    branches: [main]
    paths:
      - 'apps/fluent-chat/**'
      - 'CMakeLists.txt'
      - '.github/workflows/chat-native.yml'

permissions:
  contents: read

jobs:
  windows-chat:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Configure C++ Qt + FluentQt
        shell: pwsh
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DFSI_BUILD_APP=ON -DFSI_BUILD_CHAT=ON
          -DFLUENT_QT_BUILD_GALLERY=OFF -DFLUENT_QT_BUILD_EXAMPLES=OFF
          -DFLUENT_QT_BUILD_TESTS=OFF
      - name: Build native chat
        run: cmake --build build --config Release --target fluent-chat --parallel 4
      - name: Deploy Qt dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'build/apps/fluent-chat/Release/fluent-chat.exe'
          if (-not (Test-Path $exe)) { throw 'Missing native chat executable' }
          New-Item -ItemType Directory -Force dist/FluentChat | Out-Null
          Copy-Item $exe dist/FluentChat/
          & windeployqt --release --compiler-runtime --no-translations --dir dist/FluentChat dist/FluentChat/fluent-chat.exe
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed' }
          if (-not (Test-Path dist/FluentChat/platforms/qwindows.dll)) { throw 'Missing qwindows.dll' }
      - name: Offscreen FluentQt widget smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = (Resolve-Path 'dist/FluentChat/fluent-chat.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Smoke failed: $($process.ExitCode)" }
      - name: Package native app
        shell: pwsh
        run: Compress-Archive -Path dist/FluentChat -DestinationPath dist/FluentChat-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: FluentChat-Windows-x64
          path: dist/FluentChat-Windows-x64.zip
          if-no-files-found: error
